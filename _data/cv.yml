    Experience:
      - company: Increscent, Inc.
        position: Co-Founder and Technical Lead
        location: Texas, USA
        start_date: 2022-08
        summary: Commercializing a university-developed extrusion-based 3D-printing method that improves strength, dimensional accuracy, and repeatability.
        highlights:
          - Translated a university-developed extrusion-based 3D-printing method into a staged R&D and commercialization roadmap with measurable performance milestones and qualification criteria.
          - Authored technical proposals and grant applications, including a successful $50,000 NSF I-Corps Team award and two SBIR Phase I proposals on AI-enabled extrusion-based additive manufacturing.
          - Led structured customer discovery and translated voice-of-customer evidence into product requirements; prepared technical white papers, test reports, pitch decks, and partner/investor materials.

      - company: The University of Texas at Arlington
        position: Graduate Student Researcher
        location: Arlington, Texas, USA
        start_date: 2021-08
        end_date: 2026-08-07
        summary: Experimental and computational study of interlayer bonding, void formation, and fracture behavior in extrusion-based additive manufacturing.
        highlights:
          - Integrated MWIR thermography, X-ray micro-CT, tensile/DMA/Mode-I testing, and SEM fractography to experimentally anchor the linkage among interfacial thermal history, void morphology, and structural response.
          - Designed and analyzed a randomized 2x3x5 full-factorial program across 60 print batches using GLM/ANOVA, Type III sums of squares, interaction and residual diagnostics, and Tukey HSD.
          - Quantified in-situ annealing gains in ABS-CF - 39% higher ultimate tensile strength, 30% higher elastic modulus, 63% higher glassy storage modulus, and roughly 92% higher Mode-I fracture resistance, with crack-path voids reduced from about 4.0% to 0.7%.
          - Developed micro-CT-informed Abaqus RVEs for standard and in-situ-annealed bead architectures, with three-axis virtual homogenization, mesh convergence, and low/mid/high engineering-property envelopes.
          - Constructed Abaqus/Explicit DCB and SENB cohesive-zone models and performed ASTM D5528 and ASTM D5045 testing to calibrate and validate cohesive laws.
          - Designed and prototyped adaptive in-situ annealing printheads using GD&T and DFM/DFA, resulting in one issued and one pending U.S. patent.

      - company: The University of Texas at Arlington
        position: Teaching Assistant
        location: Arlington, Texas, USA
        start_date: 2021-09
        end_date: 2026-08
        summary: Teaching assistant across graduate and undergraduate mechanical engineering courses. Full course details on the teaching page.
        highlights:
          - "Additive Manufacturing (MAE 5329, 200+ students): conducted laboratory exercises in SLA, SLS, material jetting, and FFF; trained students on universal testing, Simplify3D, PolyWorks, 3-Matic, and FARO arm scanning; mentored senior-design teams through 3D-printed UAV design, fabrication, testing, and competition."
          - "Solid Mechanics (MAE 2312, 30 students): led supplemental problem-solving sessions, supported coursework and projects, held office hours, and evaluated assignments, quizzes, and examinations."
          - "Additional courses: Problems in MAE (MAE 1140, 100 students), Introduction to Manufacturing (MAE 3344, 50 students), Thermodynamics I (MAE 3310, 40 students), and Engineering Analysis (MAE 5332, 48 students)."

      - company: Super Petrochemical Limited
        position: Mechanical Engineer
        location: Bangladesh
        start_date: 2018-10
        end_date: 2019-10
        summary: Process equipment design, piping stress analysis, and workshop operations for oil tanker and pipeline programs.
        highlights:
          - Designed process equipment and piping layouts in SolidWorks and AutoCAD Plant 3D, performed piping-stress analysis in CAESAR II, and supported proposal review for a $10M mooring and pipeline program.
          - Coordinated a 70-person mechanical workshop and maintenance crew, prioritized work orders, allocated resources, and enforced safe, high-quality repairs using Lean Six Sigma practices.
          - Reduced oil-tanker construction and maintenance costs by approximately 10% through process-waste identification, planning improvements, and vendor coordination.


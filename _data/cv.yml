        end_date: 2026-08
        highlights:
          - "Dissertation: Improving Strength and Fracture Resistance in Fused Filament Fabrication Through Printhead-Integrated In-Situ Annealing"
          - "Advisor: Dr. Robert M. Taylor"

      - institution: Bangladesh University of Engineering and Technology (BUET)

cv:
  name: Tanvir Ahmed Shanto
  label: Mechanical Engineer, PhD
  email: txs5400@mavs.uta.edu
  location: Arlington, TX, USA
  image: ""
  summary: >
    Mechanical engineer and researcher with a Ph.D. and more than seven years of experience in experimental and
    computational solid mechanics, fracture and damage mechanics, and additive manufacturing. My research
    integrates micromechanics and cohesive-zone FEA with ASTM-based testing, MWIR thermography, X-ray
    micro-CT, SEM fractography, and design of experiments to quantify process-structure-property-performance
    relationships in anisotropic polymer systems.

  social_networks:
